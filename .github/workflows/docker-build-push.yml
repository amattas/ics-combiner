# Manual rebuild of the Docker image for an existing tag (run from that tag).
# Normal releases build via release.yml.
name: Rebuild Docker Image
on:
  workflow_dispatch:
jobs:
  image:
    uses: amattas/.github/.github/workflows/docker-build-push.yml@main
    permissions:
      contents: read
      packages: write
    with:
      verify: false
      platforms: linux/amd64,linux/arm64
