# Checks: automatic on every push to main. On pull requests the run is created
# but waits (using no runner minutes) at the `approve` job until a required
# reviewer approves it in the `approval` environment; approve from the PR's
# checks list or the run page. Manual dispatch runs the checks directly.
name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  build:
    needs: approve
    # Runs when approve passed or was skipped (push/dispatch); a rejected approval stops it.
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install black ruff==0.15.22 mypy bandit pip-audit

      - name: Format check with Black
        run: |
          black --version
          black --check --diff src tests

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Type check with mypy (non-blocking)
        run: |
          mypy src
        continue-on-error: true

      - name: Bandit security scan
        run: |
          bandit -r src

      - name: Dependency audit with pip-audit (non-blocking)
        run: |
          pip-audit -s
        continue-on-error: true
