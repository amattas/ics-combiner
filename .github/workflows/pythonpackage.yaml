name: Python package

# Manual-only. When run on main, the final `docs` job calls docs.yml to republish
# the versioned docs once every test job has passed. Release docs are published by
# create-release.yml after it tags X.Y.Z.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install black ruff==0.15.22 mypy bandit pip-audit

      - name: Format check with Black
        run: |
          black --version
          black --check --diff src tests

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Type check with mypy (non-blocking)
        run: |
          mypy src
        continue-on-error: true

      - name: Bandit security scan
        run: |
          bandit -r src

      - name: Dependency audit with pip-audit (non-blocking)
        run: |
          pip-audit -s
        continue-on-error: true

  docs:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # docs.yml pushes the gh-pages branch
    uses: ./.github/workflows/docs.yml
