# Checks — automatic on push to main; PR runs wait at `approve` until a reviewer approves in the
# `approval` environment. Release requires a successful run on main HEAD.
# Required checks (default-branch ruleset): "checks" and "security". See mattas-net/.github STANDARD.md.
# Until the ruleset moves to the alias contexts, the shared job id stays `python` so the legacy
# contexts "python / checks (3.14)" and "python / security" keep being produced.
# Deployed service: tests run on exactly the Python of the Docker image
# (python:3.14-slim); release.yml builds and pushes the image, so no build here.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  python:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: mattas-net/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      python-versions: '["3.14"]'
      extra-lint: bandit -q -r src
      build: false
      audit: strict

  checks:
    needs: python
    if: always()   # a skipped required check counts as passing, so always run and assert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared checks job
        env:
          RESULT: ${{ needs.python.outputs.checks-result }}
        run: test "$RESULT" = success

  security:
    needs: python
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared security job
        env:
          RESULT: ${{ needs.python.outputs.security-result }}
        run: test "$RESULT" = success
