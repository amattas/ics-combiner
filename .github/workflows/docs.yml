name: Docs

# Docs — build every documented version with Zensical and publish the versioned
# site (mike) to the gh-pages branch via scripts/publish_versioned_docs.py:
#   dev = main, X.Y = newest patch tag of each documented minor line,
#   latest = highest stable release (the site default; dev until a release exists).
# Pages serves gh-pages only for public repos; private repos build gh-pages but keep Pages disabled.
# Manual: run from the Actions tab (any ref). Also called (workflow_call) by
# pythonpackage.yaml after its tests pass on main, and by create-release.yml after
# it tags X.Y.Z. Always builds from main; the published versions come from the tags.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write  # publish script force-pushes the gh-pages branch

concurrency:
  group: docs-gh-pages  # distinct from any caller group; never cancel a publish mid-flight
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every release tag is rebuilt from its own sources
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install documentation tools
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure publish credentials
        env:
          GH_PAGES_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Publish
        run: python scripts/publish_versioned_docs.py --push
